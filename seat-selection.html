<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - BUSGO</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header>
        <nav class="nav-bar">
            <h3 id="logo">BUSGO</h3>

            <ul>
                <li>
                    <a href="/index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>
                <li>
                    <a href="/buses.html">
                        <i class="fa-solid fa-bus"></i>
                        Buses
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-ticket"></i>
                        My Bookings
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </a>
                </li>
            </ul>
        </nav>
    </header>



    <main>

        <!-----------------------Seat Selection--------------------------->

        <section class="seat-selection">

            <div class="section-heading">
                <p>Select Your Seat</p>
                <p>Choose the seats you want to book.</p>
            </div>


            <!----------------------------Bus Info----------------------------->

            <div id="seat-bus-info">
                
            </div>

            <!----------------------------Seat Layout------------------------->

            <div class="seat-layout-container">

                <div class="bus-front">
                    <i class="fa-solid fa-circle-user"></i>
                    Driver
                </div>

                <div id="seat-layout">

                </div>

            </div>

            <!----------------------------Seat Legend-------------------------->

            <div class="seat-legend">

                <div>
                    <span class="seat-demo available"></span>
                    Available
                </div>

                <div>
                    <span class="seat-demo selected"></span>
                    Selected
                </div>

                <div>
                    <span class="seat-demo booked"></span>
                    Booked
                </div>

            </div>

            <!----------------------------Continue------------------------------>

            <div class="seat-footer">

                <p>
                    Selected Seats:
                    <strong id="selected-seat-count">0</strong>
                </p>

                <button id="continue-seat-btn">
                    Continue
                </button>

            </div>

        </section>

    </main>

    <footer>

        <div class="footer-container">

            <h3>BUSGO</h3>

            <p>
                Your simple and reliable bus booking system.
            </p>

            <p>
                © 2026 BUSGO. All rights reserved.
            </p>

        </div>

    </footer>

    <script type="module" src="/seat-selection.js"></script>

</body>

</html>
