<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - BUSGO</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <h3 id="logo">BUSGO</h3>

            <ul>
                <li>
                    <a href="/index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>
                <li>
                    <a href="/buses.html">
                        <i class="fa-solid fa-bus"></i>
                        Buses
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-ticket"></i>
                        My Bookings
                    </a>
                </li>
                <li>
                    <a href="/login.html">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <!-----------------------Selected Bus----------------------------->

        <section class="booking-section">

            <div class="section-heading">
                <h1>Booking Details</h1>
                <p> Review your selected bus before continuing.</p>
            </div>

            <div id="selected-bus">



            </div>

        </section>

        <!----------------------------Continue--------------------------->

        <section class="booking-actions">

            <button id="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </button>

            <button id="continue-btn">
                Continue
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </section>

    </main>


    <footer>

        <div class="footer-container">

            <h3>BUSGO</h3>

            <p>
                Your simple and reliable bus booking system.
            </p>

            <p>
                © 2026 BUSGO. All rights reserved.
            </p>

        </div>

    </footer>

    <script type="module" src="/booking.js"></script>
</body>

</html>
