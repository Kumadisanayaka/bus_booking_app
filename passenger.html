<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details - BUSGO</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <header>
        <nav class="nav-bar">
            <h3 id="logo">BUSGO</h3>

            <ul>
                <li>
                    <a href="/index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>
                <li>
                    <a href="/buses.html">
                        <i class="fa-solid fa-bus"></i>
                        Buses
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-ticket"></i>
                        My Bookings
                    </a>
                </li>
                <li>
                    <a href="/login.html">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="passenger-section">

            <div class="section-heading">

                <h1>Passenger Details</h1>

                <p>Enter passenger details for your selected seats.</p>

            </div>

            <!------------------Selected Bus------------------->

            <div id="passenger-bus-info">

            </div>

            <!------------------Passenger Form------------------>

            <div id="passenger-list">

            </div>

            <!---------------Continue---------------->

            <div class="passenger-action">

                <button id="back-passenger-btn" type="button">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </button>

                <button id="continue-passenger-btn" type="button">

                    Continue

                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

        </section>

    </main>

    <!---------------- Alert Modal ---------------->

    <div id="alert-model" class="alert-model">

        <div class="alert-box">

            <div class="alert-icon">

                <i class="fa-solid fa-circle-exclamation"></i>

            </div>


            <h3 id="alert-title">
                Alert
            </h3>


            <p id="alert-message">
            </p>


            <button id="alert-ok-btn" type="button">
                OK
            </button>

        </div>

    </div>

    <footer>

        <div class="footer-container">

            <h3>BUSGO</h3>

            <p>
                Your simple and reliable bus booking system.
            </p>

            <p>
                © 2026 BUSGO. All rights reserved.
            </p>

        </div>

    </footer>

    <script type="module" src="/passenger.js"></script>
    
</body>
</html>
